name: Publish docker images for both AMD64 & ARM64

on:
  release:
    types:
      - published  # Triggers only when a release is published

jobs:
  publish-docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # `make dist` names the binaries after the latest tag.
          fetch-depth: 0

      - name: Show System Info
        run: |
          uname -a
          lscpu

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The images' linux/arm64 rootfs stage runs under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & Publish Docker Image
        run: ./hack/build_and_upload_docker.sh latest
