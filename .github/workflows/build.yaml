name: Publish docker images for both AMD64 & ARM64

on:
  release:
    types:
      - published  # Triggers only when a release is published

permissions:
  contents: read

jobs:
  publish-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A docker-container builder, which can build and push multi-arch
      # images. The image layers are assembled without running anything for
      # the target platform, so no QEMU is needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & Publish Docker Image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The binaries carry the release's version; the images keep the
          # "latest" tags the Bazel workflow pushed.
          make image-push tag="$RELEASE_TAG" image_tag=latest
