name: Check generated Go

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-generated-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-generated-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate generated Go files
        run: make gen

      - name: Check for generated file updates
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Generated Go files are out-of-date. Run 'make gen' and commit the results."
            git status --short --untracked-files=all
            git --no-pager diff --stat
            exit 1
          fi
