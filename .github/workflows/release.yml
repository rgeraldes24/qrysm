name: Release

# Builds, checksums and signs the release binaries of a v* tag and uploads them
# to the tag's GitHub release, as the CircleCI release workflow did:
# <bin>-<tag>-<os>-<arch>[.exe] with .sha256 and .sig next to each, the names
# qrysm.sh downloads.
#
# Secrets (placeholders, to be created in the repository settings):
#   RELEASE_GPG_KEY         base64 of the exported private signing key
#                           (CircleCI's GPG_KEY)
#   RELEASE_GPG_PASSPHRASE  its passphrase, if it has one (optional)
# Variable (optional, repository settings > Variables):
#   RELEASE_GPG_KEY_ID      key to sign with; defaults to the CircleCI one
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the release binaries
        run: make dist tag="$TAG"

      - name: Sign the release binaries
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ vars.RELEASE_GPG_KEY_ID || '28580FDD99DA68203ABCE4205EA04E4E0FAC11B6' }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "RELEASE_GPG_KEY is not set" >&2
            exit 1
          fi
          echo -n "$GPG_KEY" | base64 --decode | gpg --batch --import
          for f in dist/*-"$TAG"-*; do
            case "$f" in *.sha256|*.sig) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --default-key "$GPG_KEY_ID" --output "$f.sig" --detach-sig "$f"
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" dist/*-"$TAG"-* --clobber
