name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bazel cache
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ci-qrysm-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true
          cache-save: false

      - name: Test
        run: bazel test //... --test_output=errors --keep_going

      # Keys use setup-bazel's restore prefixes so the next run can prefix-match.
      - name: Stop Bazel
        if: always()
        run: bazel shutdown || true

      - name: Save Bazel disk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: setup-bazel-1-linux-x64-disk-ci-qrysm-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Save Bazel repository cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: setup-bazel-1-linux-x64-repository-${{ github.run_id }}
