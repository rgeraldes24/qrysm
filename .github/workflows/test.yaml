name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # A cold bazel test //... fills the hosted runner: the output base plus
      # the disk-cache copy of every output outgrow the root volume, and the
      # VM is shut down with no error from Bazel. Preinstalled toolchains this
      # job never uses hold about 25 GB on /; the output base moves to the
      # larger /mnt volume; the disk cache is bounded below.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/bazel
          sudo chown "$(id -u):$(id -g)" /mnt/bazel
          df -h / /mnt

      - name: Set up Bazel cache
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ci-qrysm-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true
          cache-save: false
          output-base: /mnt/bazel
          bazelrc: |
            build --experimental_disk_cache_gc_max_size=4G
            build --strip=always

      # The monitor prints free disk and memory once a minute so the log
      # shows what ran out if the runner dies again.
      - name: Test
        run: |
          (
            while sleep 60; do
              echo "[monitor] $(date -u +%H:%M:%S) avail / $(df -h --output=avail / | tail -1 | xargs) /mnt $(df -h --output=avail /mnt | tail -1 | xargs) mem-avail $(free -m | awk '/Mem:/{print $7}')MiB"
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          bazel test //... --test_output=errors --keep_going

      # Keys use setup-bazel's restore prefixes so the next run can prefix-match.
      - name: Stop Bazel
        if: always()
        run: bazel shutdown || true

      - name: Save Bazelisk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazelisk
          key: setup-bazel-1-linux-x64-bazelisk-${{ github.run_id }}

      - name: Save Bazel disk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: setup-bazel-1-linux-x64-disk-ci-qrysm-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Save Bazel repository cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: setup-bazel-1-linux-x64-repository-${{ github.run_id }}
