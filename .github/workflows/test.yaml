name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Four partitions of //... so wall clock divides by four and no runner
    # holds more than a slice of the memory-hungry beacon-chain tests. Each
    # partition keeps its own disk cache; the patterns are disjoint and
    # together cover //... exactly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: beacon-core
            targets: >-
              //beacon-chain/blockchain/... //beacon-chain/core/...
              //beacon-chain/state/... //beacon-chain/sync/...
          - name: beacon-rest
            targets: >-
              //beacon-chain/... -//beacon-chain/blockchain/... -//beacon-chain/core/...
              -//beacon-chain/state/... -//beacon-chain/sync/...
          - name: validator-testing
            targets: //validator/... //testing/... //cmd/...
          - name: rest
            targets: >-
              //... -//beacon-chain/... -//validator/... -//testing/... -//cmd/...
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # A cold bazel test is heavy for the hosted runner. Disk is kept in
      # check here and by the bounded disk cache below. Memory is the tighter
      # limit: the tests are declared medium, so Bazel budgets about 100 MB
      # each and runs four at once, while the beacon-chain and race detector
      # test binaries take gigabytes and the VM is shut down with no error
      # from Bazel; local_test_jobs below and the isolated simulation target
      # keep that in check.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/bazel
          sudo chown "$(id -u):$(id -g)" /mnt/bazel
          df -h / /mnt

      # setup-bazel restores here and saves in its post step, which runs after
      # a failed test step too (post-if: !cancelled()). Keys hash MODULE.bazel
      # and the BUILD files, so the disk cache refreshes whenever those
      # change; runs that touch only Go sources reuse the previous entry.
      - name: Set up Bazel cache
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ci-qrysm-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true
          output-base: /mnt/bazel
          bazelrc: |
            build --experimental_disk_cache_gc_max_size=4G
            build --strip=always
            test --local_test_jobs=2

      # The monitor prints free disk and memory once a minute so the log
      # shows what ran out if the runner dies again.
      - name: Test
        run: |
          (
            while sleep 60; do
              echo "[monitor] $(date -u +%H:%M:%S) avail / $(df -h --output=avail / | tail -1 | xargs) /mnt $(df -h --output=avail /mnt | tail -1 | xargs) mem-avail $(free -m | awk '/Mem:/{print $7}')MiB"
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          bazel test --test_output=errors --keep_going -- ${{ matrix.targets }}
