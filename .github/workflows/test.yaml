name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Five partitions of //... so wall clock divides and no runner holds
    # more than a slice of the memory-hungry beacon-chain tests. The chain
    # simulations get a runner to themselves: next to any other test they
    # exhaust 16 GB. Each partition keeps its own disk cache; the patterns
    # are disjoint and together cover //... exactly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulation
            targets: //beacon-chain/blockchain:simulation_test
          - name: beacon-core
            targets: >-
              //beacon-chain/blockchain/... -//beacon-chain/blockchain:simulation_test
              //beacon-chain/core/... //beacon-chain/state/... //beacon-chain/sync/...
              //crypto/hash/htr:htr_test
          - name: beacon-rest
            targets: >-
              //beacon-chain/... -//beacon-chain/blockchain/... -//beacon-chain/core/...
              -//beacon-chain/state/... -//beacon-chain/sync/...
          - name: validator-testing
            targets: //validator/... //testing/... //cmd/...
          - name: rest
            targets: >-
              //... -//beacon-chain/... -//validator/... -//testing/... -//cmd/...
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Memory is the runner's tight limit, not disk: the tests are declared
      # medium, so Bazel budgets about 100 MB each, while the beacon-chain
      # and race detector binaries take gigabytes. local_test_jobs below and
      # the isolated simulation target keep that in check; the disk cache
      # bound keeps the saved caches small.
      # setup-bazel restores here and saves in its post step, which runs after
      # a failed test step too (post-if: !cancelled()). Keys hash MODULE.bazel
      # and the BUILD files, so the disk cache refreshes whenever those
      # change; runs that touch only Go sources reuse the previous entry.
      # cache-version prefixes every key with the partition name: each
      # partition fetches a different set of Go modules, and with one shared
      # repository cache only the first partition to save had its modules
      # cached, leaving the others to re-fetch from the module proxy on every
      # run and fail on any network hiccup.
      - name: Set up Bazel cache
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          cache-version: ${{ matrix.name }}
          bazelisk-cache: true
          disk-cache: ci-qrysm-${{ runner.os }}-${{ runner.arch }}
          repository-cache: true
          bazelrc: |
            build --experimental_disk_cache_gc_max_size=4G
            build --strip=always
            test --local_test_jobs=2

      # The monitor prints free disk and memory once a minute so the log
      # shows what ran out if the runner dies again.
      - name: Test
        run: |
          # Which CPU this runner has: hash results have differed between
          # runs, and the hashing library takes CPU-specific paths.
          echo "[cpu] $(nproc) cores, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs) flags: $(grep -m1 '^flags' /proc/cpuinfo | grep -oE 'avx512[a-z]*|avx2|sha_ni' | sort -u | tr '\n' ' ')"
          (
            while sleep 60; do
              echo "[monitor] $(date -u +%H:%M:%S) disk-avail $(df -h --output=avail / | tail -1 | xargs) mem-avail $(free -m | awk '/Mem:/{print $7}')MiB"
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          bazel test --test_output=errors --keep_going -- ${{ matrix.targets }}
