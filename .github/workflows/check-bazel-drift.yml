name: Check Bazel drift

# While Bazel builds the repository it generates the proto and SSZ code
# itself; this checks that `make gen` writes what Bazel generates.
on:
  push:
    branches:
      - main
    paths:
      - 'proto/**'
      - 'build/gen/**'
      - 'tools/ssz.bzl'
      - 'third_party/com_github_prysmaticlabs_fastssz-validation.patch'
      - 'third_party/com_github_grpc_ecosystem_grpc_gateway_v2-googleapis.patch'
      - 'MODULE.bazel'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'hack/check-bazel-drift.sh'
      - '.github/workflows/check-bazel-drift.yml'
  pull_request:
    paths:
      - 'proto/**'
      - 'build/gen/**'
      - 'tools/ssz.bzl'
      - 'third_party/com_github_prysmaticlabs_fastssz-validation.patch'
      - 'third_party/com_github_grpc_ecosystem_grpc_gateway_v2-googleapis.patch'
      - 'MODULE.bazel'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'hack/check-bazel-drift.sh'
      - '.github/workflows/check-bazel-drift.yml'

permissions:
  contents: read

concurrency:
  group: check-bazel-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-bazel-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          cache-version: bazel-drift
          bazelisk-cache: true
          repository-cache: true

      - name: Regenerate generated Go files
        run: make gen proto ssz

      - name: Check generated files against Bazel output
        run: ./hack/check-bazel-drift.sh
