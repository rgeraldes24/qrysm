version: 2.1

filters-release: &filters-release
  tags:
    only:
      - /^v.*/
  branches:
    ignore: /.*/

jobs:
  publish-binaries:
    # `make dist` cross-builds every platform in a pinned linux/amd64 builder
    # container, so a single linux/amd64 machine with Docker builds them all.
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Go
          command: |
            version=$(awk '/^go /{print $2}' go.mod)
            curl -fsSL "https://go.dev/dl/go${version}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            echo 'export PATH=/usr/local/go/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Build release binaries
          command: |
            # Stamp the commit time, so that the build is reproducible.
            make dist beacon-chain validator deposit \
              platform=linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64 \
              SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
      - run:
          name: Sign and upload release binaries
          command: |
            echo -n "$GPG_KEY" | base64 --decode | gpg --import

            cd dist
            for file in beacon-chain-${CIRCLE_TAG}-* validator-${CIRCLE_TAG}-* deposit-${CIRCLE_TAG}-*; do
              sha256sum "$file" > "$file.sha256"
              gpg -o "$file.sig" --default-key 28580FDD99DA68203ABCE4205EA04E4E0FAC11B6 --sign --detach-sig "$file"

              for asset in "$file" "$file.sha256" "$file.sig"; do
                ../hack/upload-github-release-asset.sh github_api_token=$GITHUB_TOKEN owner=theQRL repo=qrysm tag=${CIRCLE_TAG} filename="$asset"
              done
            done

workflows:
  release:
    jobs:
      - publish-binaries:
          filters:
            <<: *filters-release
